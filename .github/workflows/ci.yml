name: CI

# Checks only. Deployment is done by Cloudflare Workers Builds (Git-connected Worker
# "emre-erkorkmaz"), which deploys every push to main. Branch protection on main
# (PR required + this "Build & audit" check) is what keeps unchecked code off the site.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & audit
    # Pinned: Lighthouse needs Chrome, and ubuntu-latest moves to a new image on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm run verify:privacy
        env:
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}

      - name: Lighthouse (desktop + mobile)
        run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: warn
          retention-days: 14
